<!doctype html>
<html lang="en" data-theme="light" data-text-scale="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arc{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header{% if request.url.path == '/' %} landing-header{% endif %}">
    <a class="wordmark" href="/">ARC</a>
    {% if request.url.path != '/' %}
    <nav aria-label="Primary">
      <a href="/dashboard">Dashboard</a>
      <a href="/analyst">M&A Analysis</a>
      <a href="/owner">Executive Insights</a>
      <a href="/discovery">Discovery</a>
    </nav>
    {% endif %}
    <div class="header-tools">
      <button class="text-btn" type="button" data-font="0.9" aria-label="Small text">A−</button>
      <button class="text-btn active" type="button" data-font="1" aria-label="Medium text">A</button>
      <button class="text-btn" type="button" data-font="1.15" aria-label="Large text">A+</button>
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
