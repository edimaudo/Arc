<!doctype html>
<html lang="en" data-theme="light" data-text-scale="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Arc — M&A Analysis{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="public-site">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header public-header">
    <a class="wordmark" href="/" aria-label="Arc home">ARC</a>
    <div class="public-header-actions">
      <button class="text-btn tour-launch" type="button" data-tour-open>App tour</button>
      {% if request.session.get('user_id') %}
      <a class="sign-in-link" href="/dashboard">Open workspace</a>
    {% else %}
      <a class="sign-in-link" href="/login">Sign in</a>
    {% endif %}
      <div class="header-tools" aria-label="Display settings">
        <button class="text-btn" type="button" data-font="0.9" aria-label="Small text">A−</button>
        <button class="text-btn active" type="button" data-font="1" aria-label="Medium text">A</button>
        <button class="text-btn" type="button" data-font="1.15" aria-label="Large text">A+</button>
        <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
      </div>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  {% include "tour_dialog.html" %}
  <script src="/static/js/arc-store.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/tour.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
