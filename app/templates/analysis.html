{% extends "base.html" %}
{% block title %}M&A Analysis — Arc{% endblock %}
{% block content %}
<div id="analysis-workspace" class="wrap" data-analysis-id="{{ analysis_id }}">
  <section class="page-head"><div><h1 id="analysis-title">Loading saved analysis…</h1><p class="muted" id="analysis-status">Preparing your analysis.</p></div><div class="hero-actions"><button class="button secondary" id="export-report">Export PDF</button><button class="button secondary" id="print-analysis">Print</button><button class="button secondary" id="run-investigation" type="button" hidden>Retry analysis</button></div></section>
  <div id="analysis-alert" class="form-alert" role="alert" hidden></div>
  <div id="analysis-content"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const id = document.getElementById('analysis-workspace').dataset.analysisId;
  const root = document.getElementById('analysis-content');
  const alertBox = document.getElementById('analysis-alert');
  const runButton = document.getElementById('run-investigation');
  let analysis = null;
  const esc = value => String(value ?? '').replace(/\bqloo\b/gi, 'cultural data source').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const list = values => Array.isArray(values) ? values : [];
  const labelText = value => typeof value === 'object' && value !== null ? (value.name || value.title || JSON.stringify(value)) : String(value ?? '');
  const formatAffinity = value => { const n = Number(value); if (!Number.isFinite(n)) return String(value ?? ''); return `${Math.round(n >= 0 && n <= 1 ? n * 100 : n)}/100`; };
  const finding = (item, i) => `<article class="finding"><span class="tag ${item?.type === 'Risk' ? 'risk' : 'opportunity'}">${esc(item?.type || 'Finding')}</span><h3>${esc(item?.title || `Finding ${i+1}`)}</h3><p>${esc(item?.body || item?.rationale || '')}</p></article>`;
  const items = (values, empty) => list(values).length ? `<ul class="evidence-list">${values.map(v => `<li>${esc(labelText(v))}</li>`).join('')}</ul>` : `<p class="muted">${esc(empty)}</p>`;
  const metric = (label, value) => `<div class="metric-card"><span>${esc(label)}</span><strong>${esc(value === null || value === undefined || value === '' ? '—' : value)}</strong>${Number.isFinite(Number(value)) && value !== null && value !== '' ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, Number(value)))}%"></i></div>` : ''}</div>`;
  const displayDetail = item => typeof item === 'string' ? item : (item?.detail || item?.body || item?.summary || item?.reason || item?.implication || item?.description || item?.action || '');
  const cultureList = (values, empty) => {
    if (values === undefined || values === null || values === '') return `<p class="muted">${esc(empty)}</p>`;
    if (typeof values === 'string') return `<p>${esc(values)}</p>`;
    const rows = Array.isArray(values) ? values : (typeof values === 'object' ? Object.entries(values).map(([title, detail]) => ({title, detail: typeof detail === 'string' ? detail : JSON.stringify(detail)})) : []);
    return rows.length ? `<ul class="evidence-list">${rows.map(item => `<li>${item && typeof item === 'object' ? `<strong>${esc(item.title || item.name || item.signal || item.theme || 'Signal')}</strong>${displayDetail(item) ? `<p>${esc(displayDetail(item))}</p>` : ''}${item.evidence ? `<p class="muted">Evidence: ${esc(item.evidence)}</p>` : ''}` : esc(item)}</li>`).join('')}</ul>` : `<p class="muted">${esc(empty)}</p>`;
  };
  const cultureTags = (values, empty) => Array.isArray(values) && values.length ? `<span class="cultural-tags">${values.slice(0, 8).map(x => `<span class="cultural-tag">${esc(x.name || x.title || labelText(x))}${x.category ? ` · ${esc(x.category)}` : ''}${x.affinity !== null && x.affinity !== undefined ? ` · ${esc(formatAffinity(x.affinity))}` : ''}</span>`).join('')}</span>` : `<span class="muted">${esc(empty)}</span>`;
  const explainabilityText = (value, profile = {}) => {
    if (!value) return '';
    if (typeof value === 'string') return value;
    if (typeof value !== 'object') return String(value);
    if (value.warning) return `Data note: ${String(value.warning).replace(/\bqloo\b/gi, 'cultural data source')}`;
    const aliases = new Map(list(profile.matched_entities).filter(item => item?.entity_id && item?.name).map(item => [String(item.entity_id), String(item.name)]));
    const labelFor = key => aliases.get(String(key)) || String(key).replaceAll('_', ' ');
    const valueText = detail => {
      if (typeof detail === 'number') return `${(detail <= 1 ? detail * 100 : detail).toFixed(0)}%`;
      if (Array.isArray(detail)) return detail.map(item => typeof item === 'string' ? (aliases.get(item) || item) : (item.name || aliases.get(item.entity_id || item.id) || item.entity_name || item.entity_id || '')).filter(Boolean).slice(0, 4).join(', ');
      if (detail && typeof detail === 'object') return Object.entries(detail).slice(0, 4).map(([key, nested]) => `${labelFor(key)} ${valueText(nested)}`).join(', ');
      return String(detail);
    };
    return Object.entries(value).slice(0, 5).map(([key, detail]) => `${labelFor(key)}: ${valueText(detail)}`).filter(Boolean).join(' · ');
  };
  const qlooProfileHTML = (heading, profile) => {
    const categories = list(profile?.categories).filter(cat => list(cat.results).length);
    return `<section class="cultural-category"><h3>${esc(heading)}</h3>${profile?.matched_entities?.length ? `<p class="muted">Matched: ${esc(profile.matched_entities.map(labelText).join(', '))}</p>` : ''}${categories.length ? categories.map(cat => `<div class="cultural-category"><h3>${esc(cat.label || cat.entity_type || 'Cultural category')}</h3><ul class="cultural-signal-list">${list(cat.results).slice(0,5).map(x => `<li><span class="cultural-signal-name">${esc(x.name)}</span>${x.affinity !== null && x.affinity !== undefined ? `<span class="cultural-affinity">${esc(formatAffinity(x.affinity))} affinity</span>` : ''}${explainabilityText(x.explainability, profile) ? `<details class="cultural-explanation"><summary>Why this appeared</summary><p>${esc(explainabilityText(x.explainability, profile))}</p></details>` : ''}</li>`).join('')}</ul>${explainabilityText(cat.explainability, profile) ? `<p class="muted cultural-explanation-summary">What influenced these results: ${esc(explainabilityText(cat.explainability, profile))}</p>` : ''}</div>`).join('') : `<p class="muted">${esc(String(profile?.note || 'No affinity recommendations were available for this company.').replace(/\bqloo\b/gi, 'cultural data source'))}</p>`}</section>`;
  };
  const render = a => {
    analysis = a;
    document.title = `${a.acquirer} × ${a.target} — Arc`;
    document.getElementById('analysis-title').textContent = `${a.acquirer} × ${a.target}`;
    document.getElementById('analysis-status').textContent = a.status === 'Investigation in progress' ? 'Researching both companies and reviewing available evidence…' : (a.status || 'Ready to investigate');
    const isRunning = runButton.dataset.running === 'true' || a.status === 'Investigation in progress';
    runButton.hidden = !isRunning && !a.limited_mode && a.status !== 'Investigation failed';
    runButton.disabled = isRunning;
    runButton.setAttribute('aria-busy', isRunning ? 'true' : 'false');
    runButton.textContent = isRunning ? 'Getting results…' : (a.limited_mode ? 'Retry live research' : 'Retry analysis');
    const ov = a.overview || {}, fin = a.financial || {}, biz = a.business || {}, cul = a.cultural || {}, risks = list((a.risks || {}).items);
    const qlooSignals = cul.qloo_signals || {};
    const findings = list(a.findings), ops = list(a.opportunities), questions = list(a.diligence_questions), docs = list(a.documents), activity = list(a.activity);
    const reportSummary = (a.report && (a.report.executive_summary || a.report.summary)) || a.agent_output || 'Research is underway. Findings will appear here when available.';
    const notices = [...list(a.upload_errors), ...(a.service_notice ? [a.service_notice] : [])].map(x => String(x).replace(/\bqloo\b/gi, 'cultural data source'));
    if (notices.length) { alertBox.textContent = notices.join(' '); alertBox.hidden = false; }
    else { alertBox.hidden = true; }
    const toolLabels = {qloo_lookup_entities:'Matched company identities',qloo_cultural_insights:'Analyzed cultural affinities',qloo_compare_footprints:'Compared cultural interests',qloo_trending_signals:'Reviewed cultural momentum',google_search:'Researched public company information',calculate_financial_fit:'Analyzed financial metrics',research_company:'Researched company profile',synthesize_findings:'Prepared findings and report'};
    root.innerHTML = `
      <section class="tabs" aria-label="Analysis sections"><a class="active" href="#overview">Overview</a><a href="#financial">Financial Intelligence</a><a href="#business">Business Intelligence</a><a href="#cultural">Cultural Intelligence</a><a href="#risks">Risks &amp; synergies</a><a href="#activity">Analyst activity</a></section>
      <section id="overview" class="metric-grid">${metric('Strategic fit',ov.strategic_fit)}${metric('Cultural categories', (() => { const categories = [...list(qlooSignals.acquirer_profile?.categories), ...list(qlooSignals.target_profile?.categories)]; const names = [...new Set(categories.map(x => x.label || x.entity_type).filter(Boolean))]; return names.length ? `${names.length} reviewed` : 'Not available'; })())}${metric('Audience expansion',ov.audience_expansion)}${metric('Financial fit',ov.financial_fit)}<div class="metric-card text-metric"><span>Integration risk</span><strong>${esc(ov.integration_risk ?? 'Pending')}</strong></div></section>
      <section class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Executive findings</h2></div>${findings.length ? findings.map(finding).join('') : '<p class="muted">No supported findings were returned yet. Arc researches both companies from public sources whether or not documents are uploaded.</p>'}</div>
      <div class="panel"><div class="panel-head"><h2>Deal materials</h2><span class="muted">${docs.length} files</span></div>${items(docs.map(d=>d.filename),'No materials uploaded.')}<div class="panel-head" style="margin-top:24px"><h2>Methodology</h2></div><p class="muted">Arc combines financial evidence, business research, cultural analysis, deterministic scoring, and AI-assisted synthesis. Findings remain tied to available evidence, with unresolved questions surfaced for human diligence.</p></div></section>
      <section id="financial" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Financial Intelligence</h2></div>${Object.keys(fin).length ? `<div class="score-row">${[['Revenue growth','revenue_growth'],['EBITDA margin','ebitda_margin'],['Net debt / EBITDA','net_debt_to_ebitda'],['Customer concentration','customer_concentration']].map(([l,k])=>`<div><span>${l}</span><strong>${esc(fin[k] ?? '—')}</strong></div>`).join('')}</div><p class="muted">${esc(fin.assessment || '')}</p>` : '<p class="muted">Financial evidence has not been analyzed yet.</p>'}</div></section>
      <section id="business" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Business Intelligence</h2></div>${Object.keys(biz).length ? `<div class="two-col"><div><span class="muted">Business model</span><p>${esc(biz.model || 'Not provided')}</p></div><div><span class="muted">Market</span><p>${esc(biz.market || 'Not provided')}</p></div></div><h3>Strategic rationale</h3><p class="muted">${esc(biz.strategic_rationale || 'Not provided')}</p><h3>Open questions</h3>${items(biz.open_questions,'No open business questions returned.')}` : '<p class="muted">Business analysis has not been completed yet.</p>'}</div></section>
      <section id="cultural" class="content-grid"><div class="panel span-2 cultural-section"><div class="panel-head"><h2>Cultural Intelligence</h2><span class="status">${esc(({available:'Cultural data available',partial:'Partial cultural data',unavailable:'Cultural data unavailable'}[(cul.qloo_signals || {}).status] || 'Cultural data status unknown'))}</span></div><p>${esc(cul.profile_summary || 'Arc combines public-source cultural context with affinity recommendations across brands, music, places, films and TV. These signals help identify audience adjacency, brand fit and integration questions; they are not direct customer-overlap or revenue measurements.')}</p><div class="entity-columns"><div><h3>Acquirer company match</h3>${list(cul.acquirer_entities).length?list(cul.acquirer_entities).map(x=>`<span class="entity">${esc(labelText(x))}</span>`).join(''):'<p class="muted">No confident company identity match was returned for the acquirer.</p>'}</div><div><h3>Target company match</h3>${list(cul.target_entities).length?list(cul.target_entities).map(x=>`<span class="entity">${esc(labelText(x))}</span>`).join(''):'<p class="muted">No confident company identity match was returned for the target.</p>'}</div></div><div class="cultural-category-grid">${qlooProfileHTML('Acquirer cultural affinities', qlooSignals.acquirer_profile)}${qlooProfileHTML('Target cultural affinities', qlooSignals.target_profile)}</div><div class="affinity-box"><div><span>Common cultural affinities</span><strong>${cultureTags(qlooSignals.shared_affinities, 'No shared named affinities appeared in the returned top results.')}</strong></div><div><span>Distinctive acquirer affinities</span><strong>${cultureTags(qlooSignals.acquirer_distinctive, 'No distinctive acquirer signals were available.')}</strong></div><div><span>Distinctive target affinities</span><strong>${cultureTags(qlooSignals.target_distinctive, 'No distinctive target signals were available.')}</strong></div></div><div><h3>Commercial and integration implications</h3>${cultureList(cul.audience_signals || cul.audience_overlap || cul.consumer_culture, 'No public-source audience observations were returned.')}${cultureList(cul.brand_positioning, 'Brand-positioning evidence was not returned.')}${cultureList(cul.audience_expansion_opportunities, 'No supported audience expansion opportunities were identified.')}${cultureList(cul.cultural_integration_risks, 'No specific cultural integration risks were returned.')}${cultureList(cul.practical_implications, 'Validate how shared and distinctive audience signals translate into brand and customer decisions.')}</div><p class="cultural-note">${esc(String(qlooSignals.methodology || 'Affinity results are directional taste signals. They must not be interpreted as guaranteed customer overlap, cultural compatibility, or financial performance.').replace(/\bqloo\b/gi, 'cultural data source'))}</p></div><div class="panel cultural-section"><div class="panel-head"><h2>Cross-company cultural signals</h2></div>${cultureList(list(qlooSignals.comparison?.results).map(x=>({title:x.name || 'Related entity', detail:x.type || 'Cultural signal', affinity:x.affinity})), 'No cross-company cultural recommendations were returned in this run.')}${cultureList(list(cul.source_evidence || cul.evidence), 'Public-source cultural evidence should be checked against the linked M&A report sources.')}</div></section>
      <section id="risks" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Risks &amp; synergies</h2></div>${risks.length?risks.map(finding).join(''):'<p class="muted">No material risks or opportunities have been verified yet.</p>'}</div></section>
      <section class="content-grid"><div class="panel"><div class="panel-head"><h2>Growth opportunities</h2></div>${ops.length?ops.slice(0,8).map((item,i)=>`<article class="finding"><h3>${esc(item?.title || labelText(item))}</h3>${item && typeof item==='object'?`<p>${esc(item.body || item.rationale || '')}</p>`:''}</article>`).join(''):'<p class="muted">No supported growth opportunities yet.</p>'}</div><div class="panel"><div class="panel-head"><h2>Open diligence questions</h2></div>${items(questions.slice(0,10).map(q=>q?.question || q),'No open diligence questions returned.')}</div></section>
      <section id="report" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>M&amp;A Analysis Report</h2><button class="button secondary" data-print>Print report</button></div><p class="muted">${esc(reportSummary)}</p><p class="disclaimer">${esc(a.report?.disclaimer || 'AI-generated decision support; validate material findings through conventional diligence.')}</p></div></section>
      <section id="activity" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Analyst activity</h2><span class="status">${activity.length?'Complete':'Ready'}</span></div><ol class="activity">${activity.length?activity.map(x=>`<li><span class="dot done"></span>${esc(toolLabels[x?.tool] || (x?.tool || String(x)).replace(/^qloo_/,'').replaceAll('_',' '))}</li>`).join(''):'<li><span class="dot"></span>No activity is available for this analysis yet.</li>'}</ol></div><div class="panel"><div class="panel-head"><h2>Diligence boundary</h2></div><p class="muted">Arc is decision support. It surfaces evidence and questions; it does not replace legal, financial, tax, HR or operational diligence.</p></div></section>`;
    root.querySelectorAll('[data-print]').forEach(el=>el.addEventListener('click',()=>window.print()));
  };
  const showError = message => { alertBox.textContent = message; alertBox.hidden = false; };

  async function load() {
    try {
      const data = await ArcStore.getAnalysis(id);
      if (!data) {
        document.getElementById('analysis-title').textContent = 'Analysis not saved in this browser';
        document.getElementById('analysis-status').textContent = 'This investigation is not available in the current browser.';
        root.innerHTML = '<section class="panel empty-state"><h2>Saved analysis not found</h2><p class="muted">This analysis may have been created in a different browser or after browser storage was cleared.</p><a class="button primary" href="/analysis/new">Start M&A analysis</a></section>';
        runButton.hidden = true; document.getElementById('export-report').hidden = true;
        return;
      }
      render(data);
      if (['Ready to investigate', 'Investigation in progress', 'Investigation failed'].includes(data.status)) {
        await startInvestigation();
      }
    } catch (error) { showError(error.message || 'Could not load this analysis.'); }
  }

  async function startInvestigation() {
    if (!analysis || runButton.dataset.running === 'true') return;
    runButton.dataset.running = 'true';
    runButton.hidden = false;
    runButton.disabled = true;
    runButton.setAttribute('aria-busy', 'true');
    runButton.textContent = 'Getting results…';
    analysis.status = 'Investigation in progress';
    analysis.limited_mode = false;
    document.getElementById('analysis-status').textContent = 'Researching both companies and reviewing available evidence…';
    try { await ArcStore.putAnalysis(analysis); } catch (_) { /* Continue with the in-memory payload. */ }
    render(analysis);
    try {
      const response = await fetch(`/analysis/${encodeURIComponent(id)}/run`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({analysis})});
      const data = await response.json().catch(()=>({}));
      if (!response.ok) throw new Error(data.error || 'Analysis failed.');
      analysis = data.analysis;
      await ArcStore.putAnalysis(analysis);
      alertBox.hidden = true;
      runButton.dataset.running = 'false';
      runButton.setAttribute('aria-busy', 'false');
      render(analysis);
    } catch(error) {
      showError(error.message || 'Arc could not complete the analysis.');
      analysis.status = 'Investigation failed';
      try { await ArcStore.putAnalysis(analysis); } catch (_) { /* Keep the retry path available. */ }
      document.getElementById('analysis-status').textContent = 'Analysis could not be completed';
      runButton.dataset.running = 'false';
      runButton.hidden = false;
      runButton.disabled = false;
      runButton.setAttribute('aria-busy', 'false');
      runButton.textContent = 'Retry analysis';
    } finally {
      runButton.dataset.running = 'false';
      runButton.setAttribute('aria-busy', 'false');
    }
  }
  runButton.addEventListener('click', startInvestigation);

  document.getElementById('export-report').addEventListener('click', async () => {
    if (!analysis) return;
    const button = document.getElementById('export-report'); button.disabled = true; button.textContent = 'Preparing PDF…';
    try {
      const response = await fetch(`/analysis/${encodeURIComponent(id)}/report.pdf`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis})});
      if (!response.ok) { const data=await response.json().catch(()=>({})); throw new Error(data.error || 'PDF export failed.'); }
      const blob = await response.blob(); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`arc-${analysis.acquirer}-${analysis.target}-brief.pdf`.replace(/[^a-z0-9._-]/gi,'-'); document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch(error) { showError(error.message || 'PDF export failed.'); }
    finally { button.disabled = false; button.textContent = 'Export PDF'; }
  });
  document.getElementById('print-analysis').addEventListener('click',()=>window.print());
  load();
})();
</script>
{% endblock %}
