{% extends "base.html" %}
{% block title %}New Analysis — Arc{% endblock %}
{% block content %}
<section class="wrap page-head"><div><p class="eyebrow">New investigation</p><h1>Define the deal</h1><p class="muted">Give Arc the acquisition context and the questions that matter.</p></div></section>
<section class="wrap form-shell">
<form onsubmit="event.preventDefault(); window.location='/analysis/demo-001';">
  <div class="step"><span>01</span><div><h2>Deal</h2><div class="two-col"><label>Acquirer<input value="Northstar Consumer Group"></label><label>Target<input value="PeakTrail Outdoors"></label></div><label>Primary objective<select><option>Full acquisition investigation</option><option>Cultural and audience due diligence</option><option>Identify growth opportunities</option><option>Compare potential targets</option></select></label></div></div>
  <div class="step"><span>02</span><div><h2>Evidence</h2><label class="upload"><input type="file" multiple><strong>Upload deal materials</strong><small>PDF, XLSX, CSV</small></label></div></div>
  <div class="step"><span>03</span><div><h2>Investigation scope</h2><div class="check-grid"><label><input type="checkbox" checked> Financial</label><label><input type="checkbox" checked> Business & market</label><label><input type="checkbox" checked> Cultural intelligence</label><label><input type="checkbox" checked> Integration</label></div></div></div>
  <button class="button primary" type="submit">Start investigation</button>
</form>
</section>
{% endblock %}
