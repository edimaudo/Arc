<!doctype html>
<html lang="en" data-theme="light" data-text-scale="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arc{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=20261016-performance-2">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/">ARC</a>
    <nav aria-label="Primary">
      <a href="/dashboard"{% if request.url.path == '/dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="/analyst"{% if request.url.path == '/analyst' or request.url.path.startswith('/analysis') %} aria-current="page"{% endif %}>Acquisition Analysis</a>
      <a href="/owner"{% if request.url.path == '/owner' %} aria-current="page"{% endif %}>Business Insights</a>
      <a href="/discovery"{% if request.url.path.startswith('/discovery') %} aria-current="page"{% endif %}>Discovery</a>
    </nav>
    <div class="header-tools">
      {% if request.session.get('user_id') %}<form class="logout-form" method="post" action="/logout"><button class="text-btn logout-btn" type="submit">Sign out</button></form>{% endif %}
            <button class="text-btn" type="button" data-font="0.9" aria-label="Small text">A−</button>
      <button class="text-btn active" type="button" data-font="1" aria-label="Medium text">A</button>
      <button class="text-btn" type="button" data-font="1.15" aria-label="Large text">A+</button>
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
      <button class="icon-btn tour-launch" type="button" data-tour-open aria-label="Open app tour" title="App tour">?</button>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  {% include "tour_dialog.html" %}
  <script src="/static/js/arc-store.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/tour.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
