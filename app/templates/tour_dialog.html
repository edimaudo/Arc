<dialog id="arc-tour" aria-labelledby="arc-tour-title" aria-describedby="arc-tour-description">
  <section class="panel tour-panel">
    <div class="panel-head"><span class="tour-progress" id="tour-progress">1 of 5</span><button class="icon-btn" type="button" id="tour-close" aria-label="Close walkthrough">×</button></div>
    <div class="tour-progress-track"><span id="tour-progress-bar"></span></div>
    <h2 id="arc-tour-title">Welcome to Arc</h2>
    <p id="arc-tour-description">Arc brings together three independent tools for company research and acquisition analysis.</p>
    <div class="tour-controls"><button class="button secondary" type="button" id="tour-skip">Skip walkthrough</button><div class="hero-actions"><button class="button secondary" type="button" id="tour-back" disabled>Back</button><button class="button primary" type="button" id="tour-next">Next</button></div></div>
  </section>
</dialog>
