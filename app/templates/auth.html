{% extends "public_base.html" %}
{% block title %}Sign in — Arc{% endblock %}
{% block content %}
<section class="auth wrap">
  <div class="auth-card">
    <h1>Sign in to Arc</h1>
    {% if error %}<div class="form-alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="email">Email address
        <input id="email" name="email" type="email" required maxlength="254" autocomplete="username" autofocus>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" required minlength="1" maxlength="256" autocomplete="current-password">
      </label>
      <button class="button primary full" type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
