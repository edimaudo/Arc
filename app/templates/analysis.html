{% extends "base.html" %}
{% block title %}M&A Analysis — Arc{% endblock %}
{% block content %}
<div id="analysis-workspace" class="wrap" data-analysis-id="{{ analysis_id }}">
  <section class="page-head"><div><h1 id="analysis-title">Loading saved analysis…</h1><p class="muted" id="analysis-status">Loading your investigation.</p></div><div class="hero-actions"><button class="button secondary" id="export-report">Export PDF</button><button class="button secondary" id="print-analysis">Print</button><button class="button primary" id="run-investigation">Run investigation</button></div></section>
  <div id="analysis-alert" class="form-alert" role="alert" hidden></div>
  <div id="analysis-content"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const id = document.getElementById('analysis-workspace').dataset.analysisId;
  const root = document.getElementById('analysis-content');
  const alertBox = document.getElementById('analysis-alert');
  const runButton = document.getElementById('run-investigation');
  let analysis = null;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const list = values => Array.isArray(values) ? values : [];
  const labelText = value => typeof value === 'object' && value !== null ? (value.name || value.title || JSON.stringify(value)) : String(value ?? '');
  const finding = (item, i) => `<article class="finding"><span class="tag ${item?.type === 'Risk' ? 'risk' : 'opportunity'}">${esc(item?.type || 'Finding')}</span><h3>${esc(item?.title || `Finding ${i+1}`)}</h3><p>${esc(item?.body || item?.rationale || '')}</p></article>`;
  const items = (values, empty) => list(values).length ? `<ul class="evidence-list">${values.map(v => `<li>${esc(labelText(v))}</li>`).join('')}</ul>` : `<p class="muted">${esc(empty)}</p>`;
  const metric = (label, value) => `<div class="metric-card"><span>${esc(label)}</span><strong>${esc(value === null || value === undefined || value === '' ? '—' : value)}</strong>${Number.isFinite(Number(value)) && value !== null && value !== '' ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, Number(value)))}%"></i></div>` : ''}</div>`;
  const render = a => {
    analysis = a;
    document.title = `${a.acquirer} × ${a.target} — Arc`;
    document.getElementById('analysis-title').textContent = `${a.acquirer} × ${a.target}`;
    document.getElementById('analysis-status').textContent = a.status || 'Ready to investigate';
    runButton.disabled = a.status === 'Investigation in progress';
    runButton.textContent = a.limited_mode ? 'Retry live research' : (a.status === 'Investigation complete' ? 'Run again' : (a.status === 'Investigation in progress' ? 'Investigating…' : 'Run investigation'));
    const ov = a.overview || {}, fin = a.financial || {}, biz = a.business || {}, cul = a.cultural || {}, risks = list((a.risks || {}).items);
    const findings = list(a.findings), ops = list(a.opportunities), questions = list(a.diligence_questions), docs = list(a.documents), activity = list(a.activity);
    const reportSummary = (a.report && (a.report.executive_summary || a.report.summary)) || a.agent_output || 'Run the investigation to generate an evidence-based brief.';
    const notices = [...list(a.upload_errors), ...(a.service_notice ? [a.service_notice] : [])];
    if (notices.length) { alertBox.textContent = notices.join(' '); alertBox.hidden = false; }
    else { alertBox.hidden = true; }
    const toolLabels = {qloo_lookup_entities:'Matched cultural entities',qloo_cultural_insights:'Analyzed cultural affinities',qloo_compare_footprints:'Compared cultural footprints',qloo_trending_signals:'Reviewed cultural momentum',google_search:'Researched public company information',calculate_financial_fit:'Analyzed financial metrics',research_company:'Researched company profile',synthesize_findings:'Prepared findings and report'};
    root.innerHTML = `
      <section class="tabs" aria-label="Analysis sections"><a class="active" href="#overview">Overview</a><a href="#financial">Financial Intelligence</a><a href="#business">Business Intelligence</a><a href="#cultural">Cultural Intelligence</a><a href="#risks">Risks &amp; synergies</a><a href="#activity">Analyst activity</a></section>
      <section id="overview" class="metric-grid">${metric('Strategic fit',ov.strategic_fit)}${metric('Cultural alignment',ov.cultural_alignment)}${metric('Audience expansion',ov.audience_expansion)}${metric('Financial fit',ov.financial_fit)}<div class="metric-card text-metric"><span>Integration risk</span><strong>${esc(ov.integration_risk ?? 'Pending')}</strong></div></section>
      <section class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Executive findings</h2></div>${findings.length ? findings.map(finding).join('') : '<p class="muted">Run the investigation to research both companies from public sources. Supporting documents can add financial and operational evidence, but are not required.</p>'}</div>
      <div class="panel"><div class="panel-head"><h2>Deal materials</h2><span class="muted">${docs.length} files</span></div>${items(docs.map(d=>d.filename),'No materials uploaded.')}<div class="panel-head" style="margin-top:24px"><h2>Methodology</h2></div><p class="muted">Arc combines financial evidence, business research, cultural analysis, deterministic scoring, and AI-assisted synthesis. Findings remain tied to available evidence, with unresolved questions surfaced for human diligence.</p></div></section>
      <section id="financial" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Financial Intelligence</h2></div>${Object.keys(fin).length ? `<div class="score-row">${[['Revenue growth','revenue_growth'],['EBITDA margin','ebitda_margin'],['Net debt / EBITDA','net_debt_to_ebitda'],['Customer concentration','customer_concentration']].map(([l,k])=>`<div><span>${l}</span><strong>${esc(fin[k] ?? '—')}</strong></div>`).join('')}</div><p class="muted">${esc(fin.assessment || '')}</p>` : '<p class="muted">Financial evidence has not been analyzed yet.</p>'}</div></section>
      <section id="business" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Business Intelligence</h2></div>${Object.keys(biz).length ? `<div class="two-col"><div><span class="muted">Business model</span><p>${esc(biz.model || 'Not provided')}</p></div><div><span class="muted">Market</span><p>${esc(biz.market || 'Not provided')}</p></div></div><h3>Strategic rationale</h3><p class="muted">${esc(biz.strategic_rationale || 'Not provided')}</p><h3>Open questions</h3>${items(biz.open_questions,'No open business questions returned.')}` : '<p class="muted">Business analysis has not been completed yet.</p>'}</div></section>
      <section id="cultural" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Cultural Intelligence</h2></div><div class="entity-columns"><div><h3>Acquirer footprint</h3>${list(cul.acquirer_entities).length?list(cul.acquirer_entities).map(x=>`<span class="entity">${esc(labelText(x))}</span>`).join(''):'<p class="muted">Not yet analyzed.</p>'}</div><div><h3>Target footprint</h3>${list(cul.target_entities).length?list(cul.target_entities).map(x=>`<span class="entity">${esc(labelText(x))}</span>`).join(''):'<p class="muted">Not yet analyzed.</p>'}</div></div><div class="affinity-box"><div><span>Shared affinities</span><strong>${esc(list(cul.shared).length?list(cul.shared).join(', '):'Pending analysis')}</strong></div><div><span>Distinct territory</span><strong>${esc(list(cul.distinct).length?list(cul.distinct).join(', '):'Pending analysis')}</strong></div></div></div><div class="panel"><div class="panel-head"><h2>Cultural signals</h2></div>${items(['Brand and cultural-entity matching','Cross-domain affinities','Acquirer and target comparison','Predictive signals where available','Cultural momentum over time'],'')}</div></section>
      <section id="risks" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Risks &amp; synergies</h2></div>${risks.length?risks.map(finding).join(''):'<p class="muted">Run the investigation to identify material risks and opportunities.</p>'}</div></section>
      <section class="content-grid"><div class="panel"><div class="panel-head"><h2>Growth opportunities</h2></div>${ops.length?ops.slice(0,8).map((item,i)=>`<article class="finding"><h3>${esc(item?.title || labelText(item))}</h3>${item && typeof item==='object'?`<p>${esc(item.body || item.rationale || '')}</p>`:''}</article>`).join(''):'<p class="muted">No supported growth opportunities yet.</p>'}</div><div class="panel"><div class="panel-head"><h2>Open diligence questions</h2></div>${items(questions.slice(0,10).map(q=>q?.question || q),'No open diligence questions returned.')}</div></section>
      <section id="report" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>M&amp;A Analysis Report</h2><button class="button secondary" data-print>Print report</button></div><p class="muted">${esc(reportSummary)}</p><p class="disclaimer">${esc(a.report?.disclaimer || 'AI-generated decision support; validate material findings through conventional diligence.')}</p></div></section>
      <section id="activity" class="content-grid"><div class="panel span-2"><div class="panel-head"><h2>Analyst activity</h2><span class="status">${activity.length?'Complete':'Ready'}</span></div><ol class="activity">${activity.length?activity.map(x=>`<li><span class="dot done"></span>${esc(toolLabels[x?.tool] || (x?.tool || String(x)).replace(/^qloo_/,'').replaceAll('_',' '))}</li>`).join(''):'<li><span class="dot"></span>Waiting for investigation.</li>'}</ol></div><div class="panel"><div class="panel-head"><h2>Diligence boundary</h2></div><p class="muted">Arc is decision support. It surfaces evidence and questions; it does not replace legal, financial, tax, HR or operational diligence.</p></div></section>`;
    root.querySelectorAll('[data-print]').forEach(el=>el.addEventListener('click',()=>window.print()));
  };
  const showError = message => { alertBox.textContent = message; alertBox.hidden = false; };

  async function load() {
    try {
      const data = await ArcStore.getAnalysis(id);
      if (!data) {
        document.getElementById('analysis-title').textContent = 'Analysis not saved in this browser';
        document.getElementById('analysis-status').textContent = 'This investigation is not available in the current browser.';
        root.innerHTML = '<section class="panel empty-state"><h2>Saved analysis not found</h2><p class="muted">This analysis may have been created in a different browser or after browser storage was cleared.</p><a class="button primary" href="/analysis/new">Start M&A analysis</a></section>';
        runButton.hidden = true; document.getElementById('export-report').hidden = true;
        return;
      }
      render(data);
    } catch (error) { showError(error.message || 'Could not load this investigation.'); }
  }

  runButton.addEventListener('click', async () => {
    if (!analysis) return;
    runButton.disabled = true; runButton.textContent = 'Investigating…';
    document.getElementById('analysis-status').textContent = 'Investigation in progress';
    try {
      const response = await fetch(`/analysis/${encodeURIComponent(id)}/run`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({analysis})});
      const data = await response.json().catch(()=>({}));
      if (!response.ok) throw new Error(data.error || 'Investigation failed.');
      analysis = data.analysis;
      await ArcStore.putAnalysis(analysis);
      alertBox.hidden = true; render(analysis);
    } catch(error) {
      showError(error.message || 'Arc could not complete the investigation.');
      document.getElementById('analysis-status').textContent = 'Investigation failed';
      runButton.disabled = false; runButton.textContent = 'Retry investigation';
    }
  });

  document.getElementById('export-report').addEventListener('click', async () => {
    if (!analysis) return;
    const button = document.getElementById('export-report'); button.disabled = true; button.textContent = 'Preparing PDF…';
    try {
      const response = await fetch(`/analysis/${encodeURIComponent(id)}/report.pdf`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis})});
      if (!response.ok) { const data=await response.json().catch(()=>({})); throw new Error(data.error || 'PDF export failed.'); }
      const blob = await response.blob(); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`arc-${analysis.acquirer}-${analysis.target}-brief.pdf`.replace(/[^a-z0-9._-]/gi,'-'); document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch(error) { showError(error.message || 'PDF export failed.'); }
    finally { button.disabled = false; button.textContent = 'Export PDF'; }
  });
  document.getElementById('print-analysis').addEventListener('click',()=>window.print());
  load();
})();
</script>
{% endblock %}
